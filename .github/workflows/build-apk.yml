# ============================================================================
# Builds the NoveLA APK on every push to default/main + on manual dispatch.
# The resulting APK is uploaded as a downloadable artifact (expires in 90
# days unless re-built).
#
# This workflow is what builds your APK — no Android Studio or local SDK
# install required. Just push to GitHub and download the APK from the
# Actions tab.
# ============================================================================
name: Build APK

on:
  push:
    branches: [ default, main, master ]
  pull_request:
    branches: [ default, main, master ]
  workflow_dispatch: {}    # manual trigger from the Actions tab

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-37.0
            build-tools;37.0.0

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoveLA-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 90
          if-no-files-found: error
