## Gradle build environment configuration
# https://docs.gradle.org/current/userguide/build_environment.html

# --- Required ---
android.nonTransitiveRClass=false
android.useAndroidX=true
kotlin.code.style=official

# --- JVM ---
# Reduced from -Xmx4g to fit a 3.4GB-RAM container. ParallelGC is
# kept because it has the lowest memory overhead of the available
# collectors. If you have more RAM, restore -Xmx4g for faster builds.
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=384m -XX:+UseParallelGC -Dfile.encoding=UTF-8
# Kotlin compiler daemon — separate JVM, also capped.
kotlin.daemon.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=384m

# --- Performance ---
# Disabled parallelism + workers.max=1 to fit a 3.4GB-RAM container.
# On a normal dev machine, restore parallel=true and workers.max=4.
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.vfs.watch=false
org.gradle.configuration-cache=false
org.gradle.workers.max=1

# --- Console ---
# Принудительно plain-консоль: в неинтерактивных оболочках rich-консоль Gradle
# буферизует вывод и сборка выглядит зависшей ("gradlew.bat бесконечно висит").
org.gradle.console=plain

